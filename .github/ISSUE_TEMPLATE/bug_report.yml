name: 🐛 Bug 反馈
description: 报告一个 Bug 帮助我们改进
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间反馈 Bug！🙏

        > 💡 **如果你觉得 GalaxyEpoch 有用，欢迎[赞助支持](https://github.com/sponsors/GalaxyEpoch)持续开发！**

  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 清晰描述你遇到的问题
      placeholder: 我在使用...时遇到了...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 你是如何触发这个 Bug 的？
      placeholder: |
        1. 打开...
        2. 点击...
        3. 看到...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本号
      description: 你使用的 GalaxyEpoch 版本
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 如果有控制台日志或错误信息，请粘贴在这里
      render: shell

  - type: textarea
    id: screenshot
    attributes:
      label: 截图
      description: 如果有截图，请拖拽到这里
