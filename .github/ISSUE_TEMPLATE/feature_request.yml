name: ✨ 功能请求
description: 建议一个新功能或改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的功能建议！🚀

        > 💡 **想加速这个功能开发？[赞助支持](https://github.com/sponsors/GalaxyEpoch)或在 [IssueHunt](https://issuehunt.io/GalaxyEpoch) 为此 Issue 设悬赏！**

  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 这个功能请求解决了什么问题？
      placeholder: 我在使用...时，发现无法...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望怎么解决？
      placeholder: 我希望能...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代方案？

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 你认为这个功能有多重要？
      options:
        - 低 - 有了更好
        - 中 - 比较有用
        - 高 - 强烈需要
        - 紧急 - 没有就没法用
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他任何有助于理解的信息
